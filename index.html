<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DAMAURA – Handmade Bracelets</title>
  <meta name="description" content="DAMAURA handmade bracelets — simple shop with bank transfer only. Soft pastel pink theme. Read-only for visitors.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body {font-family:'Poppins', sans-serif;margin:0;padding:0;background-color:#fff6f9;color:#333;}
    header {padding:20px;text-align:center;background:linear-gradient(90deg,#ffd4df,#fff6f9);} 
    h1 {margin:0;font-size:26px;color:#b84a71;} 
    .container {max-width:1000px;margin:0 auto;padding:20px;} 
    .grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;} 
    .card {background:#fff;border-radius:12px;box-shadow:0 4px 10px rgba(0,0,0,0.08);overflow:hidden;} 
    .card img {width:100%;height:260px;object-fit:cover;display:block;background:#f7f7fb;} 
    .card-content {padding:15px;} 
    .card h3 {margin:0;font-size:18px;color:#b84a71;} 
    .price {font-weight:600;color:#444;margin:8px 0;} 
    .btn {display:inline-block;background:#ffb6c9;color:#6b0022;padding:10px 16px;border-radius:8px;text-decoration:none;font-weight:600;} 
    .btn:hover {opacity:0.85;} 
    footer {text-align:center;padding:20px;font-size:14px;color:#777;} 
  </style>
</head>
<body>
  <header>
    <h1>DAMAURA – Handmade Bracelets</h1>
    <p>Soft pastel collection • Bank Transfer Only</p>
  </header>

  <div class="container">
    <div id="grid" class="grid"></div>
  </div>

  <footer>
    <p>© <span id="yr"></span> DAMAURA | WhatsApp: <a id="waFooter" href="#">Message Me</a></p>
  </footer>

  <script>

    const CONFIG = {

      currencyLabel: "Rs.",

        {id:"BR-102", name:"Braided Friendship", price:1800, image:"https://images.unsplash.com/photo-1617031310867-1f7d47d09472?q=80&w=1200&auto=format&fit=crop", note:"Hand-braided cotton"}
      ]
    };

    const grid=document.getElementById('grid');

    function fmt(n){ return new Intl.NumberFormat('en-LK').format(Number(n||0)); }

    function waLink(p){
      const phone = CONFIG.whatsapp.replace(/[^\d]/g, '');
      const text = `Hello! I want to order: ${p.name} (ID ${p.id}) — ${CONFIG.currencyLabel} ${fmt(p.price)}. Is it available?`;
      const msg = encodeURIComponent(text);
      // Use API endpoint which works on both desktop & mobile
      return `https://api.whatsapp.com/send?phone=${phone}&text=${msg}`;

    }

    function card(p){
      return `<div class='card'>
        <img src='${p.image}' alt='${p.name}' referrerpolicy='no-referrer' loading='lazy'>
        <div class='card-content'>
          <h3>${p.name}</h3>
          <div class='price'>${CONFIG.currencyLabel} ${fmt(p.price)}</div>
          <p>${p.note||''}</p>
          <a class='btn' href='${waLink(p)}' target='_blank' rel='noopener'>Order via WhatsApp</a>

      </div>`;

    function render(){ grid.innerHTML = CONFIG.products.map(card).join(''); }

    render();
    document.getElementById('yr').textContent = new Date().getFullYear();
    document.getElementById('waFooter').href = `https://api.whatsapp.com/send?phone=${CONFIG.whatsapp.replace(/[^\d]/g,'')}`;

</body>
</html>
